name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/kudumart-api
            git fetch origin main
            git switch main
            git merge --ff-only origin/main
            echo "Deploying backend commit $(git rev-parse --short HEAD)"
            npm ci
            npm run build
            npm run migrate
            pm2 reload kudumart-api --update-env || pm2 restart kudumart-api --update-env || pm2 start dist/index.js --name kudumart-api
            pm2 save
