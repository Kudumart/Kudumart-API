name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd /var/www/kudumart-api
            git pull --ff-only origin main
            npm ci
            npm run build
            pm2 reload kudumart-api --update-env || pm2 restart kudumart-api --update-env || pm2 start dist/index.js --name kudumart-api
            pm2 save
